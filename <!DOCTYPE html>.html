<!DOCTYPE html>
<html lang="id">
<head>

</head>
<body>

    <!-- Header / Menu Navigasi -->
    <header>
        <div class="logo">Portofolio</div>
        <nav>
            <a href="#tentang">Tentang</a>
            <a href="#proyek">Proyek</a>
            <a href="#kontak">Kontak</a>
        </nav>
    </header>

    <!-- Bagian Utama / Hero Section -->
    <section class="hero">
        <h1>Halo, Saya <span>Faris</span> 👋</h1>

        <a href="#proyek" class="btn">Lihat Karya Saya</a>

                <p>Proyek pembuatan portofolio pribadi menggunakan HTML dan CSS yang terintegrasi dengan GitHub.</p>

            <!-- Kartu Proyek 2 -->

                <p>Website interaktif ucapan dan undangan interaktif dengan tampilan modern.</p>
            </div>

    <!-- Bagian Kontak -->
    <section id="kontak" class="section">
        <h2>Hubungi Saya</h2>
        <p>Ingin bekerja sama atau sekadar menyapa? Silakan hubungi saya melalui:</p>
        <div class="kontak-links">
            <a href="https://github.com/farisrahmangantenk04" target="_blank" class="btn-outline">GitHub Saya</a>

    <!-- Footer -->
    <footer>
